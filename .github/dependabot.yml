version: 2
# Routine application updates share one review and notification thread each week.
# GitHub Actions stay separate so the guarded workflow can evaluate one action.
# Docker stays separate because a base-image refresh must be reviewed together
# with the exact Alpine Chromium package pinned by the App image.
# Security alerts remain governed by GitHub's separate security-update settings.
multi-ecosystem-groups:
  weekly-maintenance:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: weekly-maintenance
    ignore:
      # jsdom 30 drops the Node 20 support retained by this repository.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: weekly-maintenance
    ignore:
      # Home Assistant 2026.8.3 requires this exact test fixture; 0.13.358+
      # targets Home Assistant 2026.9 prereleases.
      - dependency-name: "pytest-homeassistant-custom-component"
        versions:
          - ">=0.13.358"
      # The pinned Home Assistant test fixture requires pytest==9.0.3.
      - dependency-name: "pytest"
        versions:
          - ">=9.1.0"

  - package-ecosystem: pip
    directory: "/bridge_service"
    patterns:
      - "*"
    multi-ecosystem-group: weekly-maintenance
    ignore:
      # Pydantic is pinned transitively by the Home Assistant test fixture and
      # must move with the repository's Home Assistant compatibility version.
      - dependency-name: "pydantic"
        versions:
          - ">=2.13.5"
      # The pinned Home Assistant test fixture requires pytest==9.0.3.
      - dependency-name: "pytest"
        versions:
          - ">=9.1.0"

  - package-ecosystem: docker
    directory: "/codex_bridge_app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
